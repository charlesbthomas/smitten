[package]
name = "smitten-examples"
description = "Example games for the Smitten game framework"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sdl-from-source"]
# Passed through to `smitten`, so `--no-default-features` links against an
# SDL3 that is already installed.
sdl-from-source = ["smitten/sdl-from-source"]
sdl-static = ["smitten/sdl-static"]

[dependencies]
smitten = { path = "../smitten", default-features = false, features = ["physics", "video"] }
smitten-kit = { path = "../smitten-kit", default-features = false }

[lints]
workspace = true

# The examples share one assets folder, so each packaged example ships only
# the files it uses. See "Hot reload and releasing" in the guide.
[package.metadata.smitten.example.pong]
include = []

[package.metadata.smitten.example.shardfall]
include = ["shardfall-*"]
