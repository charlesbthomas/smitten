[package]
name = "smitten-kit"
description = "Game structure on top of Smitten: scenes, timers and tweens, input actions and a camera"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sdl-from-source"]
# Passed through to `smitten`, so `--no-default-features` links against an
# SDL3 that is already installed.
sdl-from-source = ["smitten/sdl-from-source"]
sdl-static = ["smitten/sdl-static"]

[dependencies]
smitten = { path = "../smitten", default-features = false }

[lints]
workspace = true
