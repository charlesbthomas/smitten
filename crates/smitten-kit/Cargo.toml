[package]
name = "smitten-kit"
description = "Game structure on top of Smitten: scenes, timers and tweens, input actions, a camera, sprites, tilemaps, UI and saves"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sdl-from-source", "tiled", "save"]
# Loading and drawing maps from the Tiled editor.
tiled = ["smitten-kit-core/tiled"]
# Save slots holding versioned serde data.
save = ["smitten-kit-core/save", "dep:serde"]
# Passed through to `smitten`, so `--no-default-features` links against an
# SDL3 that is already installed.
sdl-from-source = ["smitten/sdl-from-source"]
sdl-static = ["smitten/sdl-static"]

[dependencies]
smitten = { path = "../smitten", default-features = false }
smitten-kit-core = { path = "../smitten-kit-core", features = ["color"] }
serde = { version = "1", optional = true }

[lints]
workspace = true
