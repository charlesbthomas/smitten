name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDL3 is built from source, which needs its X11, Wayland and audio
      # headers. See the Linux recipe in the justfile for the full list.
      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl-dev libudev-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The shader tests run every Metal translation through Apple's
      # compiler. Newer Xcodes download it separately.
      - name: Metal compiler
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
        env:
          SMITTEN_REQUIRE_METAL: "1"

      # Opens a window and draws for a few seconds with each example, on
      # the runner's Metal GPU. A panic, or quitting early, fails the step.
      - name: Run examples on Metal
        env:
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/crates/examples
        run: |
          status=0
          for example in hello lantern shader mesh canvas lighting stencil; do
            target/debug/examples/$example > "$example.log" 2>&1 &
            pid=$!
            sleep 6
            if kill -0 "$pid" 2>/dev/null && ! grep -q "panicked" "$example.log"; then
              echo "$example: ran for 6 seconds"
              kill "$pid"
            else
              echo "::error::$example stopped or panicked on Metal"
              kill "$pid" 2>/dev/null || true
              status=1
            fi
            cat "$example.log"
          done
          exit $status

      - name: Package an example as an app
        run: cargo run -p cargo-smitten -- package -p smitten-examples --example lantern

      - name: Check the app
        run: |
          app=target/package/Lantern.app
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$app"
          test -x "$app/Contents/MacOS/lantern"
          test -f "$app/Contents/Resources/AppIcon.icns"
          test -d "$app/Contents/Resources/assets"
          otool -L "$app/Contents/MacOS/lantern"
          # SDL is linked in, so the app needs nothing outside macOS.
          ! otool -L "$app/Contents/MacOS/lantern" | grep -i sdl

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-macos
          path: target/package/lantern-macos-*.zip
