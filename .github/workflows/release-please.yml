name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Keeps a release PR open that bumps the workspace version in
      # Cargo.toml and Cargo.lock and updates CHANGELOG.md from the
      # Conventional Commit messages on main. Merging that PR tags the
      # release (vX.Y.Z) and publishes a GitHub release.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
