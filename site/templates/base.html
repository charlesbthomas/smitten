<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <link rel="stylesheet" href="{{ get_url(path='syntax-light.css') }}" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="{{ get_url(path='syntax-dark.css') }}" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ get_url(path='favicon.svg') }}" type="image/svg+xml">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ get_url(path='/') }}"><img src="{{ get_url(path='favicon.svg') }}" alt="" width="22" height="22"> Smitten</a>
    <nav>
      <a href="{{ get_url(path='@/guide/_index.md') }}">Guide</a>
      <a href="{{ get_url(path='@/examples/_index.md') }}">Examples</a>
      <a href="{{ get_url(path='api/smitten/index.html') }}">API</a>
      <a href="{{ config.extra.repo }}">GitHub</a>
    </nav>
  </header>
  {% block body %}{% endblock %}
  <footer>
    Smitten is a 2D game framework for Rust.
    <a href="{{ config.extra.repo }}">Source on GitHub</a>.
  </footer>
</body>
</html>
