[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/charlesbthomas/smitten"
license = "Zlib"
publish = false

[workspace.dependencies]
smitten-core = { path = "crates/smitten-core" }
smitten-sdl = { path = "crates/smitten-sdl", default-features = false }
sdl3-sys = "0.7.3"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
