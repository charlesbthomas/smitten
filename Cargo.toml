[package]
name = "smitten"
version = "0.0.1"
edition = "2024"
description = "A LÖVE-style 2D game framework for Rust"
repository = "https://github.com/charlesbthomas/smitten"
publish = false

[features]
default = ["sdl-from-source"]
# Build SDL3 from source with CMake so `cargo run` needs no system SDL install.
# Turn this off to link against an SDL3 that is already installed.
sdl-from-source = ["sdl3-sys/build-from-source"]

[dependencies]
sdl3-sys = "0.7.3"
